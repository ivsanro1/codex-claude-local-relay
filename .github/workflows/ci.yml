name: tests
on:
  push:
  pull_request:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: codex-claude-local-relay --version
      - run: python -m unittest discover -s tests -v
  codex-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        codex: ['0.155.0', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: npm install --prefix "$RUNNER_TEMP/codex" --no-audit --no-fund "@openai/codex@${{ matrix.codex }}"
      - name: Active turn, tool boundary, idle wakeup and input receipts
        env:
          CODEX_RELAY_RUNTIME_TEST: '1'
        run: |
          export PATH="$RUNNER_TEMP/codex/node_modules/.bin:$PATH"
          python -m unittest discover -s tests -p test_codex_runtime.py -v
